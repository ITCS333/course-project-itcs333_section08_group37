<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Resources</title>

   <style>
    :root {
      --primary-color: #4f46e5; 
      --secondary-color: #6366f1; 
      --overlay-color: rgba(0,0,0,0.35);
      --card-bg: rgba(255, 255, 255, 0.95);
      --radius: 14px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(var(--overlay-color), var(--overlay-color)),
        url('../../assets/INAF_20200625130048928-a63e604c-961d-4ff5-b510-c942671571f9.jpeg')
        no-repeat center/cover fixed;
      padding: 30px;
      display: flex;
      justify-content: center;
      color: #1f2937;
    }

    main {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: var(--radius);
      box-shadow: 0 12px 28px rgba(0,0,0,.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    ul {
      list-style: none;
    }

    li {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,.15);
      transition: .25s;
    }

    li:hover {
      transform: translateY(-2px);
      background: #eef2ff;
    }

    a {
      text-decoration: none;
      color: var(--primary-color);
      font-weight: 700;
    }
    </style>
</head>
<body>

    <!-- TASK2104: header -->
    <header>
        <h1>All Course Resources</h1>
    </header>

    <main>
        <ul id="resourcesList">
           
        </ul>
    </main>

    <script src="list.js"></script>
</body>
</html>
