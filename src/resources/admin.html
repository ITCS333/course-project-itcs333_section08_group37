<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Resources</title>
    <!-- ربط إطار عمل CSS (Bootstrap) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Header -->
    <header class="bg-primary text-white text-center py-4 mb-4">
        <h1>Manage Course Resources</h1>
    </header>

    <!-- Main content -->
    <main class="container">

        <!-- Section 1: Add/Edit Resource Form -->
        <section class="mb-5">
            <h2>Add a New Resource</h2>
            <form id="resource-form" action="#" class="border p-4 bg-white rounded shadow-sm">
                <fieldset>
                    <legend>Resource Details</legend>

                    <div class="mb-3">
                        <label for="resource-title" class="form-label">Resource Title</label>
                        <input type="text" id="resource-title" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="resource-description" class="form-label">Resource Description</label>
                        <textarea id="resource-description" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="resource-link" class="form-label">Resource Link</label>
                        <input type="url" id="resource-link" class="form-control" required>
                    </div>

                    <button type="submit" id="add-resource" class="btn btn-success">Add Resource</button>
                </fieldset>
            </form>
        </section>

        <!-- Section 2: Existing Resources List -->
        <section>
            <h2>Existing Resources</h2>
            <table id="resources-table" class="table table-striped table-bordered bg-white shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Row 1 -->
                    <tr>
                        <td>Chapter 1 Notes</td>
                        <td>Introduction to HTML and basic tags.</td>
                        <td>
                            <button class="btn btn-primary btn-sm me-2">Edit</button>
                            <button class="btn btn-danger btn-sm">Delete</button>
                        </td>
                    </tr>
                    <!-- Row 2 -->
                    <tr>
                        <td>Lecture Slides - Week 2</td>
                        <td>Slides covering CSS fundamentals.</td>
                        <td>
                            <button class="btn btn-primary btn-sm me-2">Edit</button>
                            <button class="btn btn-danger btn-sm">Delete</button>
                        </td>
                    </tr>
                    <!-- Row 3 -->
                    <tr>
                        <td>External Resource: W3Schools</td>
                        <td>Useful online tutorials for web development.</td>
                        <td>
                            <button class="btn btn-primary btn-sm me-2">Edit</button>
                            <button class="btn btn-danger btn-sm">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <!-- Bootstrap JS (اختياري إذا كنت تحتاج أزرار JS) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
