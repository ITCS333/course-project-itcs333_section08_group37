<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Details</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <!-- Header -->
    <header>
        <h1>Chapter 1 Notes</h1>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Section 1: Resource Information -->
        <article>
            <p>
                A comprehensive summary of the first chapter, covering all key concepts.
            </p>
            <a href="https://example.com" target="_blank">Access Resource Material</a>
        </article>

        <!-- Section 2: Discussion Forum -->
        <section id="discussion-forum">
            <h2>Discussion</h2>

            <!-- Subsection 2.1: Existing Comments -->
            <div class="comments-list">
                <!-- Example Comment 1 -->
                <article class="comment">
                    <p>This was very helpful, thanks!</p>
                    <footer>Posted by: Mariam Khalifa</footer>
                </article>

                <!-- Example Comment 2 -->
                <article class="comment">
                    <p>I found a typo on page 2.</p>
                    <footer>Posted by: Ahmed Jasim</footer>
                </article>
            </div>

            <!-- Subsection 2.2: Add a Comment Form -->
            <form id="comment-form" action="#">
                <fieldset>
                    <legend>Leave a Comment</legend>

                    <label for="new-comment">Your Comment:</label>
                    <textarea id="new-comment" required></textarea>

                    <button type="submit">Post Comment</button>
                </fieldset>
            </form>

        </section>

    </main>
</body>
</html>
