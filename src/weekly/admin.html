<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Weekly Breakdown</title>

    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        h1, h2 { margin-bottom: 15px; }
        fieldset { background: white; padding: 15px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 10px; }
        button { padding: 10px 15px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; }
        tr:hover { background: #f0f0ff; }
        .edit-btn, .delete-btn { background: #6366f1; padding: 6px 10px; border-radius: 6px; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>Manage Weekly Breakdown</h1>
    </header>

    <main>

        <section>
            <h2>Add a New Week</h2>
            <form id="week-form">
                <fieldset>
                    <legend>Weekly Details</legend>

                    <label for="week-title">Week Title:</label>
                    <input id="week-title" type="text" required>

                    <label for="week-start-date">Start Date:</label>
                    <input id="week-start-date" type="date" required>

                    <label for="week-description">Description & Notes:</label>
                    <textarea id="week-description" rows="4"></textarea>

                    <label for="week-links">Exercises & Resources (one per line):</label>
                    <textarea id="week-links" rows="3"></textarea>

                    <button type="submit">Add Week</button>
                </fieldset>
            </form>
        </section>

        <section>
            <h2>Current Weekly Breakdown</h2>
            <table>
                <thead>
                    <tr>
                        <th>Week Title</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="weeks-tbody">
                    <!-- JS will inject rows here -->
                </tbody>
            </table>
        </section>

    </main>

    <script src="admin.js" defer></script>
</body>
</html>
