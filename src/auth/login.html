<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

</head>
<body>
    <main style="display:flex; justify-content:center; align-items:center; height:100vh;">
        <section style="max-width:400px; width:100%; padding:2rem; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1);">
            <div id="message-container"></div>
            <h2>Welcome Back!</h2>
            <form id="login-form" action="#" method="post">
                <fieldset>
                    <legend>Secure Login</legend>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" required>

                    <label for="password">Password</label>
                    <input type="password" id="password" required minlength="8">

                    <button type="submit" id="login">Log In</button>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
