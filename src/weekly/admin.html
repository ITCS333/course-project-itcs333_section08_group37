<!--
  Requirement: Create the Admin View for the Weekly Breakdown

  Instructions:
  Fill in the HTML elements as described in the comments.
  This page allows the teacher (admin) to perform full CRUD operations on the weekly course content.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Weekly Breakdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Manage Weekly Breakdown</h1>
    </header>

    <main>

        <!-- Section 1: Add/Edit Week Form -->
        <section>
            <h2>Add a New Week</h2>

            <form id="week-form" action="#">
                <fieldset>
                    <legend>Weekly Details</legend>

                    <label for="week-title">Week Title:</label><br>
                    <input id="week-title" type="text" required placeholder="Week 1: Introduction to HTML"><br><br>

                    <label for="week-start-date">Start Date:</label><br>
                    <input id="week-start-date" type="date" required><br><br>

                    <label for="week-description">Description & Notes:</label><br>
                    <textarea id="week-description" rows="5" placeholder="Write the details for this week here..."></textarea><br><br>

                    <label for="week-links">Exercises & Resources (one link per line):</label><br>
                    <textarea id="week-links" rows="3" placeholder="https://example.com"></textarea><br><br>

                    <button id="add-week" type="submit">Add Week</button>

                </fieldset>
            </form>
        </section>

        <br>

        <!-- Section 2: Existing Weekly Entries -->
        <section>
            <h2>Current Weekly Breakdown</h2>

            <table id="weeks-table" border="1" width="100%">
                <thead>
                    <tr>
                        <th>Week Title</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="weeks-tbody">
                    <tr>
                        <td>Week 1: Intro to HTML</td>
                        <td>Basics of HTML and structure.</td>
                        <td>
                            <button>Edit</button>
                            <button>Delete</button>
                        </td>
                    </tr>

                    <tr>
                        <td>Week 2: Intro to CSS</td>
                        <td>Basic styling and selectors.</td>
                        <td>
                            <button>Edit</button>
                            <button>Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

</body>
</html>
