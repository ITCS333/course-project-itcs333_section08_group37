<!--
  Requirement: Create the Admin View for the Weekly Breakdown

  Instructions:
  Fill in the HTML elements as described in the comments.
  This page allows the teacher (admin) to perform full CRUD operations on the weekly course content.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- charset -->
    <meta charset="UTF-8">

    <!-- responsive viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- page title -->
    <title>Manage Weekly Breakdown</title>

    <!-- simple stylesheet (change the path if you have a different file) -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Manage Weekly Breakdown</h1>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Section 1: Add/Edit Week Form -->
        <section>
            <h2>Add a New Week</h2>

            <form id="week-form" action="#">
                <fieldset>
                    <legend>Weekly Details</legend>

                    <!-- Week title -->
                    <label for="week-title">Week Title</label>
                    <input
                        id="week-title"
                        type="text"
                        placeholder="Week 1: Introduction to HTML"
                        required
                    >

                    <!-- Start date -->
                    <label for="week-start-date">Start Date</label>
                    <input
                        id="week-start-date"
                        type="date"
                        required
                    >

                    <!-- Description -->
                    <label for="week-description">Description &amp; Notes</label>
                    <textarea
                        id="week-description"
                        rows="5"
                        placeholder="Overview of what will be covered this week..."
                    ></textarea>

                    <!-- Links -->
                    <label for="week-links">Exercises / Resources (one link per line)</label>
                    <textarea
                        id="week-links"
                        rows="3"
                        placeholder="https://example.com/ex1&#10;https://example.com/notes"
                    ></textarea>

                    <!-- Submit button -->
                    <button id="add-week" type="submit">Add Week</button>
                </fieldset>
            </form>
        </section>

        <!-- Section 2: Existing Weekly Entries -->
        <section>
            <h2>Current Weekly Breakdown</h2>

            <table id="weeks-table">
                <thead>
                    <tr>
                        <th>Week Title</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="weeks-tbody">
                    <!-- Dummy row 1 -->
                    <tr>
                        <td>Week 1: Intro to HTML</td>
                        <td>Basic structure of a web page and common tags.</td>
                        <td>
                            <button class="edit-btn" data-id="dummy1">Edit</button>
                            <button class="delete-btn" data-id="dummy1">Delete</button>
                        </td>
                    </tr>

                    <!-- Dummy row 2 -->
                    <tr>
                        <td>Week 2: CSS Basics</td>
                        <td>Selectors, colors, fonts and simple layouts.</td>
                        <td>
                            <button class="edit-btn" data-id="dummy2">Edit</button>
                            <button class="delete-btn" data-id="dummy2">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- JS -->
    <script src="admin.js" defer></script>
</body>
</html>
