<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Title -->
    <title>Manage Weekly Breakdown</title>

    <!-- CSS (ممكن تستخدم Bootstrap أو ملفك الخاص) -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Manage Weekly Breakdown</h1>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Section 1: Add/Edit Week Form -->
        <section>
            <h2>Add a New Week</h2>
            <form id="week-form" action="#">
                <fieldset>
                    <legend>Weekly Details</legend>

                    <!-- Week Title -->
                    <label for="week-title">Week Title:</label>
                    <input id="week-title" type="text" placeholder="Week 1: Introduction to HTML" required>

                    <!-- Start Date -->
                    <label for="week-start-date">Start Date:</label>
                    <input id="week-start-date" type="date" required>

                    <!-- Description -->
                    <label for="week-description">Description & Notes:</label>
                    <textarea id="week-description" rows="5"></textarea>

                    <!-- Links -->
                    <label for="week-links">Exercises & Resources (one per line):</label>
                    <textarea id="week-links" rows="3"></textarea>

                    <!-- Submit Button -->
                    <button id="add-week" type="submit">Add Week</button>
                </fieldset>
            </form>
        </section>

        <!-- Section 2: Existing Weekly Entries -->
        <section>
            <h2>Current Weekly Breakdown</h2>
            <table id="weeks-table" border="1">
                <thead>
                    <tr>
                        <th>Week Title</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="weeks-tbody">
                    <!-- Dummy Row 1 -->
                    <tr>
                        <td>Week 1: Intro to HTML</td>
                        <td>Basic structure and tags</td>
                        <td>
                            <button class="edit-btn">Edit</button>
                            <button class="delete-btn">Delete</button>
                        </td>
                    </tr>
                    <!-- Dummy Row 2 -->
                    <tr>
                        <td>Week 2: Intro to CSS</td>
                        <td>Selectors and styling basics</td>
                        <td>
                            <button class="edit-btn">Edit</button>
                            <button class="delete-btn">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>

    </main>

    <!-- JS -->
    <script src="admin.js" defer></script>
</body>
</html>
