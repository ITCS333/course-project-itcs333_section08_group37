<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week Details</title>

    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        h1, h2 { margin-bottom: 10px; }
        article, section { background: white; padding: 15px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        ul { padding-left: 20px; }
        article p { margin-bottom: 10px; }
        footer { font-size: 0.9rem; color: #555; }
        textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; }
        button { padding: 10px 15px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1 id="week-title"></h1>
    </header>

    <main>

        <article>
            <p id="week-start-date"></p>

            <h2>Description & Notes</h2>
            <p id="week-description"></p>

            <h2>Exercises & Resources</h2>
            <ul id="week-links-list"></ul>
        </article>

        <section id="discussion-forum">
            <h2>Discussion</h2>

            <div id="comment-list"></div>

            <form id="comment-form">
                <fieldset>
                    <legend>Ask a Question</legend>

                    <label for="new-comment-text">Your Comment:</label>
                    <textarea id="new-comment-text" rows="4" required></textarea>

                    <button type="submit">Post Comment</button>
                </fieldset>
            </form>
        </section>

    </main>

    <script src="details.js" defer></script>
</body>
</html>
