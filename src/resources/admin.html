<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Resources</title>

    <style>
    :root {
      --primary-color: #4f46e5; 
      --secondary-color: #6366f1; 
      --accent-color: #f59e0b; 
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.9);
      --overlay-color: rgba(0,0,0,0.35);
      --muted-color: #6b7280;
      --radius: 14px;
      --max-width: 1100px;
      --gap: 22px;
      --transition-speed: .25s;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(var(--overlay-color), var(--overlay-color)),
        url('../../assets/INAF_20200625130048928-a63e604c-961d-4ff5-b510-c942671571f9.jpeg')
        no-repeat center / cover fixed;
      padding: 34px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      color: #1f2937;
      line-height: 1.7;
    }

    header h1 {
      color: white;
      font-size: 2.2rem;
      text-align: center;
      margin-bottom: 20px;
      text-shadow: 0 2px 6px rgba(0,0,0,.4);
    }

    main {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: var(--radius);
      box-shadow: 0 12px 28px rgba(0,0,0,.25);
      backdrop-filter: blur(8px);
    }

    h2 {
      margin-bottom: 14px;
      color: #111827;
      font-weight: 700;
    }

    label {
      margin-top: 10px;
      display: block;
      font-weight: 600;
    }

    input[type=text],
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      margin-top: 6px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 10px;
    }

    thead {
      background: var(--primary-color);
      color: white;
    }

    th, td {
      padding: 14px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }
    </style>
</head>

<body>

<header>
    <h1>Admin Panel - Manage Course Resources</h1>
</header>

<main class="container">

    <section>
        <h2>Add / Edit Resource</h2>
        <form id="resourceForm">
            <input type="hidden" id="resourceId">

            <label for="title">Title</label>
            <input type="text" id="title" required>

            <label for="description">Description</label>
            <textarea id="description"></textarea>

            <label for="link">Link</label>
            <input type="text" id="link" required>

            <button type="submit">Save Resource</button>
            <button type="button" id="cancelEdit" onclick="resetForm()">Cancel</button>
        </form>
    </section>

    <section>
        <h2>All Resources</h2>
        <table id="resourcesTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Link</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Resources will be loaded here -->
            </tbody>
        </table>
    </section>

</main>

</body>
</html>
