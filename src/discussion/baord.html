<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>General Discussion Board</title>

    <link rel="stylesheet" href="../../common/styles.css"> </head>
<body>

    <header>
        <h1>General Discussion Board</h1>
    </header>

    <main class="container">

        <section id="new-topic-section">
            <h2>Start a New Topic</h2>

            <form id="new-topic-form" action="#">
                <fieldset>
                    <legend>New Topic Details</legend>

                    <label for="topic-subject">Subject</label>
                    <input id="topic-subject" type="text" name="subject" required>

                    <label for="topic-message">Message</label>
                    <textarea id="topic-message" name="message" rows="6" required></textarea>

                    <button id="create-topic" type="submit">Create Topic</button>
                </fieldset>
            </form>
        </section>

        <hr>

        <section id="existing-topics-section">
            <h2>All Topics</h2>
            
            <div id="topic-list-container">
                <p>Loading topics...</p>
                </div>
        </section>

    </main>
    
    <script src="board.js" defer></script>
</body>
</html>
