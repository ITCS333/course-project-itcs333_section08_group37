<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Resources</title>
    <style>:root {
      --primary-color: #4f46e5; 
      --secondary-color: #6366f1; 
      --accent-color: #f59e0b; 
      --bg-color: #f5f5f7;
      --card-bg: rgba(255, 255, 255, 0.9);
      --overlay-color: rgba(0,0,0,0.35);
      --muted-color: #6b7280;
      --radius: 14px;
      --max-width: 1100px;
      --gap: 22px;
      --transition-speed: .25s;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      background:
        linear-gradient(var(--overlay-color), var(--overlay-color)),
        url('../../assets/INAF_20200625130048928-a63e604c-961d-4ff5-b510-c942671571f9.jpeg')
        no-repeat center/cover fixed;
      padding:34px;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      color:#1f2937;
      line-height:1.7;
    }

    header h1{
      color:white;
      font-size:2.2rem;
      text-align:center;
      margin-bottom:20px;
      text-shadow:0 2px 6px rgba(0,0,0,.4);
    }

    main{
      width:100%;
      max-width:900px;
      background:var(--card-bg);
      padding:30px;
      border-radius:var(--radius);
      box-shadow:0 12px 28px rgba(0,0,0,.25);
      backdrop-filter:blur(8px);
    }

    /* HEADINGS */
    h2, h3 {
      margin-bottom:14px;
      color:#111827;
      font-weight:700;
    }

    /* FORMS */
    fieldset{
      border:1px solid #d1d5db;
      padding:18px;
      border-radius:var(--radius);
      margin-bottom:18px;
      background:white;
    }

    legend{
      font-weight:700;
      padding:0 8px;
    }

    label{
      margin-top:10px;
      display:block;
      font-weight:600;
    }

    input[type=text],
    input[type=email],
    input[type=password],
    textarea{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid #d1d5db;
      background:#f9fafb;
      margin-top:6px;
      transition:.25s;
    }

    input:focus, textarea:focus{
      border-color:var(--primary-color);
      box-shadow:0 0 0 3px rgba(99,102,241,.25);
      outline:none;
    }

    /* BUTTONS */
    button, #change, #add{
      padding:10px 16px;
      border:none;
      border-radius:12px;
      background:linear-gradient(90deg, var(--primary-color), var(--secondary-color));
      color:white;
      font-weight:700;
      cursor:pointer;
      margin-top:14px;
      box-shadow:0 4px 12px rgba(0,0,0,.2);
      transition:.25s;
    }

    button:hover{
      transform:translateY(-2px);
      opacity:.95;
    }

    /* DETAILS */
    details summary{
      cursor:pointer;
      padding:10px;
      background:#eef2ff;
      border-radius:12px;
      font-weight:600;
      margin-bottom:12px;
    }

    details[open] summary{
      background:#e0e7ff;
    }

    /* TABLE */
    table{
      width:100%;
      border-collapse:collapse;
      background:white;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 4px 16px rgba(0,0,0,.15);
      margin-top:10px;
    }

    thead{
      background:var(--primary-color);
      color:white;
    }

    th, td{
      padding:14px;
      border-bottom:1px solid #e5e7eb;
      text-align:left;
    }

    tbody tr:hover{
      background:#f3f4ff;
    }

    td button{
      background:#6366f1;
      padding:6px 12px;
      margin-right:6px;
      border-radius:8px;
    }

    td button:hover{
      opacity:.85;
    }

    /* MOBILE */
    @media(max-width:600px){
      main{ padding:20px; }
      th, td{ padding:10px; }
      button{ width:100%; margin-top:10px; }
    }
</style>
</head>
<body>
    <div class="container">
        <h1>All Course Resources</h1>

        <ul id="resourcesList">
            
        </ul>
    </div>

    <script src="list.js"></script>
</body>
</html>
